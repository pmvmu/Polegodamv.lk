<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Preview — Applications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Serif+Sinhala:wght@500;600;700&family=Noto+Sans+Sinhala:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="brand">
    <div class="brand-text">
      <div class="name-tag"></div>
    </div>
  </div>
  <div class="page-title" id="pageTitle">APPLICATIONS</div>
</header>

<div class="preview-wrap">
  <button class="pill-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i> <span id="backLabel">Back</span></button>

  <h1 id="docTitle" style="font-family:'Playfair Display',serif;color:var(--maroon-800);font-size:1.5rem;margin:26px 0 14px;"></h1>

  <div class="preview-frame" id="previewFrame"></div>

  <div class="download-cta">
    <a class="pill-btn gold" id="downloadBtn" download>
      <i class="fa-solid fa-download"></i> <span id="downloadLabel">Download</span>
    </a>
  </div>

  <div class="instructions-box">
    <h2 id="instructionsTitle">Instructions</h2>
    <div class="steps">
      <div class="step-card"><i class="fa-solid fa-download"></i><span id="step1">Download</span></div>
      <div class="step-card"><i class="fa-solid fa-print"></i><span id="step2">Print &amp; Fill</span></div>
      <div class="step-card"><i class="fa-solid fa-building-columns"></i><span id="step3">Hand it over to the school</span></div>
    </div>
    <p class="contact-note"><span id="contactNote">Please contact the office if a problem arises..</span> <b id="contactPhone"></b></p>
  </div>
</div>

<footer class="site-footer" style="margin-top:40px;">
  <p class="rights" id="rightsText">All rights reserved</p>
  <p id="yearLine">2026 Polegoda Maha Vidyalaya - Mahagama</p>
  <p id="maintainedText">Maintained by School's IT circle</p>
</footer>

<script src="app.js"></script>
<script>
let DATA = loadCachedData();
const appId = qs('id');

document.getElementById('backBtn').addEventListener('click', () => {
  window.location.href = 'index.html';
});

function renderPreview(){
  const app = DATA.applications.find(a => a.id === appId);
  const lang = getLang();
  document.documentElement.lang = lang;
  document.body.classList.toggle('lang-si', lang === 'si');

  document.getElementById('pageTitle').textContent = t('applications');
  document.getElementById('backLabel').textContent = t('back');
  document.getElementById('downloadLabel').textContent = t('download');
  document.getElementById('instructionsTitle').textContent = t('instructions');
  document.getElementById('step1').textContent = t('stepDownload');
  document.getElementById('step2').textContent = t('stepPrint');
  document.getElementById('step3').textContent = t('stepHandOver');
  document.getElementById('contactNote').textContent = t('contactNote');
  document.getElementById('contactPhone').textContent = DATA.school.phone || '';
  document.getElementById('rightsText').textContent = t('rights');
  document.getElementById('maintainedText').textContent = t('maintainedBy');
  document.getElementById('yearLine').textContent = `${DATA.school.year} Polegoda Maha Vidyalaya - ${DATA.school.place}`;

  const frame = document.getElementById('previewFrame');
  const downloadBtn = document.getElementById('downloadBtn');
  const titleEl = document.getElementById('docTitle');

  if (!app){
    titleEl.textContent = t('notFound');
    frame.innerHTML = `<div class="preview-placeholder"><i class="fa-solid fa-triangle-exclamation"></i>${t('notFound')}</div>`;
    downloadBtn.style.display = 'none';
    return;
  }

  titleEl.textContent = lang === 'si' ? app.title_si : app.title_en;

  if (app.pdfUrl){
    const resolvedUrl = resolvePdfUrl(app.pdfUrl);
    frame.innerHTML = `<iframe src="${escapeHtml(toEmbedUrl(resolvedUrl))}" title="PDF preview"></iframe>`;
    downloadBtn.href = resolvedUrl;
    downloadBtn.setAttribute('download', slugify(app.title_en) + '.pdf');
    downloadBtn.style.display = '';
    downloadBtn.style.opacity = '';
    downloadBtn.style.pointerEvents = '';
  } else {
    frame.innerHTML = `<div class="preview-placeholder">
      <i class="fa-solid fa-file-pdf"></i>
      ${t('pdfPreview')}
      <div class="sub">${t('noFileYet')}</div>
    </div>`;
    downloadBtn.removeAttribute('href');
    downloadBtn.style.opacity = '.5';
    downloadBtn.style.pointerEvents = 'none';
  }
}

renderPreview();
loadData().then(fresh => { DATA = fresh; renderPreview(); });
</script>
</body>
</html>
