<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applications — WP/Hr/Polegoda Maha Vidyalaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Serif+Sinhala:wght@500;600;700&family=Noto+Sans+Sinhala:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="brand">
    <div class="brand-text">
      <div class="name-tag"></div>
    </div>
  </div>
  <div class="page-title" id="pageTitle">APPLICATIONS</div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Search applications…">
    <button class="pill-btn" id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i> <span id="searchLabel">Search</span></button>
  </div>
  <div class="control-group">
    <div class="combo">
      <select class="select-pill" id="sortSelect">
        <option value="recent">Recently</option>
        <option value="oldest">Oldest</option>
        <option value="az">A – Z</option>
      </select>
    </div>
    <div class="combo">
      <select class="select-pill" id="filterSelect">
        <option value="">All categories</option>
      </select>
    </div>
    <div class="combo">
      <select class="select-pill" id="langSelect">
        <option value="en">English</option>
        <option value="si">සිංහල</option>
      </select>
    </div>
  </div>
</div>

<main class="content" id="content"></main>

<footer class="site-footer">
  <p class="rights" id="rightsText">All rights reserved</p>
  <p id="yearLine">2026 Polegoda Maha Vidyalaya - Mahagama</p>
  <p id="maintainedText">Maintained by School's IT circle</p>
  <a class="footer-admin" href="admin.html"><i class="fa-solid fa-lock"></i> <span id="adminLinkText">Admin</span></a>
</footer>

<script src="app.js"></script>
<script>
let DATA = loadData();

function applyStaticText(){
  const lang = getLang();
  document.documentElement.lang = lang;
  document.body.classList.toggle('lang-si', lang === 'si');
  document.getElementById('pageTitle').textContent = t('applications');
  document.getElementById('searchInput').placeholder = t('searchPlaceholder');
  document.getElementById('searchLabel').textContent = t('search');
  document.getElementById('rightsText').textContent = t('rights');
  document.getElementById('maintainedText').textContent = t('maintainedBy');
  document.getElementById('adminLinkText').textContent = t('adminLink');
  document.getElementById('yearLine').textContent =
    `${DATA.school.year} Polegoda Maha Vidyalaya - ${DATA.school.place}`;

  const sortSelect = document.getElementById('sortSelect');
  sortSelect.options[0].textContent = t('recently');
  sortSelect.options[1].textContent = t('oldest');
  sortSelect.options[2].textContent = t('az');

  const filterSelect = document.getElementById('filterSelect');
  filterSelect.options[0].textContent = t('allCategories');

  document.getElementById('langSelect').value = lang;
}

function populateCategoryFilter(){
  const filterSelect = document.getElementById('filterSelect');
  const lang = getLang();
  const current = filterSelect.value;
  filterSelect.innerHTML = `<option value="">${t('allCategories')}</option>` +
    DATA.categories.map(c => `<option value="${escapeHtml(c.id)}">${escapeHtml(lang==='si'?c.si:c.en)}</option>`).join('');
  filterSelect.value = current || "";
}

function render(){
  applyStaticText();
  populateCategoryFilter();

  const lang = getLang();
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const sort = document.getElementById('sortSelect').value;
  const filterCat = document.getElementById('filterSelect').value;

  const content = document.getElementById('content');
  content.innerHTML = '';

  const cats = filterCat ? DATA.categories.filter(c => c.id === filterCat) : DATA.categories;
  let anyRendered = false;

  cats.forEach(cat => {
    let apps = DATA.applications.filter(a => a.categoryId === cat.id);

    if (search){
      apps = apps.filter(a =>
        (a.title_en||'').toLowerCase().includes(search) ||
        (a.title_si||'').toLowerCase().includes(search)
      );
    }

    if (sort === 'recent') apps = apps.slice().sort((a,b) => (b.date||'').localeCompare(a.date||''));
    else if (sort === 'oldest') apps = apps.slice().sort((a,b) => (a.date||'').localeCompare(b.date||''));
    else if (sort === 'az') apps = apps.slice().sort((a,b) => (a.title_en||'').localeCompare(b.title_en||''));

    if (apps.length === 0) return;
    anyRendered = true;

    const banner = document.createElement('div');
    banner.className = 'category-banner';
    banner.textContent = lang === 'si' ? cat.si : cat.en;
    content.appendChild(banner);

    const grid = document.createElement('div');
    grid.className = 'card-grid';

    apps.forEach(app => {
      const card = document.createElement('div');
      card.className = 'app-card';
      const title = lang === 'si' ? app.title_si : app.title_en;
      card.innerHTML = `
        <div class="thumb"><i class="fa-solid fa-file-pdf"></i> ${t('pdfPreview')}</div>
        <div class="app-title">${escapeHtml(title)}</div>
        <button class="open-btn" data-id="${escapeHtml(app.id)}">
          <i class="fa-solid fa-arrow-up-right-from-square"></i> ${t('openDocument')}
        </button>`;
      grid.appendChild(card);
    });

    content.appendChild(grid);
  });

  if (!anyRendered){
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = `<i class="fa-solid fa-folder-open" style="font-size:2rem;display:block;margin-bottom:14px;"></i>${t('noResults')}`;
    content.appendChild(empty);
  }

  content.querySelectorAll('.open-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      window.location.href = `preview.html?id=${encodeURIComponent(btn.dataset.id)}`;
    });
  });
}

document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('searchBtn').addEventListener('click', render);
document.getElementById('sortSelect').addEventListener('change', render);
document.getElementById('filterSelect').addEventListener('change', render);
document.getElementById('langSelect').addEventListener('change', (e) => {
  setLang(e.target.value);
  render();
});

render();
</script>
</body>
</html>
